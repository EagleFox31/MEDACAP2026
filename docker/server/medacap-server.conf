# Durcissement serveur : n'expose que le site, pas les outils CLI ni les dossiers internes.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<DirectoryMatch "^/var/www/html/(\.git|\.claude|\.vscode|scratch|scripts|cronjobs|docs|docker|exports|caches|vendor|App|core|offline-qcm)(/|$)">
    Require all denied
</DirectoryMatch>

<Directory /var/www/html>
    # Racine : seuls index.php et portal.php sont des pages. Le reste (scripts de debug, .md, .json, .xlsx, .log, ...) est refusé.
    <If "%{REQUEST_URI} =~ m#^/[^/]+\.(php|py|md|json|lock|log|txt|xlsx|ps1|exclude|sh|yml|yaml)$# && %{REQUEST_URI} !~ m#^/(index|portal)\.php$#">
        Require all denied
    </If>
</Directory>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>
