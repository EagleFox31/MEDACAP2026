    <circle r="36" fill="#9ca3af" stroke="#4b5563" stroke-width="4"/><circle r="10" fill="#4b5563"/>
  </g>
  <line x1="700" y1="320" x2="700" y2="352" stroke="#1e3a5f" stroke-width="5" marker-end="url(#ar)"/>
  <text x="60" y="420" font-size="21" fill="#0f172a">Rapport total moteur → roue :</text>
  <rect x="60" y="440" width="300" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="210" y="478" text-anchor="middle" font-size="28" font-weight="800" fill="#92400e">? : 1</text>
