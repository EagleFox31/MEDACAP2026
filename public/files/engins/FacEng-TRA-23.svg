<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="st" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1e3a5f"/></marker>
  </defs>
  <rect width="800" height="560" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="798" height="558" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Chaîne de transmission d'une chargeuse</text>
  <g stroke="#1e3a5f" stroke-width="2.5">
    <rect x="30" y="200" width="130" height="120" rx="12" fill="url(#st)"/>
    <rect x="215" y="200" width="150" height="120" rx="12" fill="url(#st)"/>
    <rect x="420" y="200" width="150" height="120" rx="12" fill="url(#st)"/>
    <rect x="625" y="200" width="150" height="120" rx="12" fill="url(#st)"/>
  </g>
  <g stroke="#1e3a5f" stroke-width="5" marker-end="url(#ar)">
    <line x1="160" y1="260" x2="208" y2="260"/><line x1="365" y1="260" x2="413" y2="260"/><line x1="570" y1="260" x2="618" y2="260"/>
  </g>
  <g text-anchor="middle" fill="#0f172a">
    <text x="95" y="252" font-size="22" font-weight="700">Moteur</text><text x="95" y="282" font-size="17" fill="#475569">+ convertisseur</text>
    <text x="290" y="248" font-size="22" font-weight="700">Boîte</text><text x="290" y="296" font-size="30" font-weight="800" fill="#b45309">3 : 1</text>
    <text x="495" y="238" font-size="22" font-weight="700">Pont</text><text x="495" y="262" font-size="16" fill="#475569">couple conique</text><text x="495" y="302" font-size="30" font-weight="800" fill="#b45309">4 : 1</text>
    <text x="700" y="238" font-size="22" font-weight="700">Réducteur</text><text x="700" y="262" font-size="16" fill="#475569">de roue</text><text x="700" y="302" font-size="30" font-weight="800" fill="#b45309">5 : 1</text>
